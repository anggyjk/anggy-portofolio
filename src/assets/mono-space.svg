<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Thumbnail Mono Space">
  <defs>
    <linearGradient id="msbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161618"/><stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <filter id="msgrain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#msbg)"/>
